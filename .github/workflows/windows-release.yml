name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build Web Application
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @dev-pre-review/web build

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv sync --locked
          uv pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          uv run pyinstaller packaging/windows/dev-pre-review.spec --noconfirm

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile Installer with Inno Setup
        shell: pwsh
        run: |
          iscc packaging/windows/installer.iss

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 dist/installer/*.exe | Out-File -Encoding utf8 dist/installer/SHA256SUMS.txt
          Get-Content dist/installer/SHA256SUMS.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevPreReview-Windows-Setup
          path: dist/installer/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          generate_release_notes: true
