[project]
name = "dev-pre-review"
version = "0.1.0"
description = "Local drawing pre-review and improvement suggestion web app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "ezdxf>=1.4.5",
    "qdrant-client>=1.11.0",
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src", "apps/api/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src"]
extend-exclude = ["apps/web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api/src"
